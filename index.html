<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surya Jaya Sport | Toko Olahraga &amp; Musik Berau</title>
  <meta name="description" content="Katalog perlengkapan olahraga dan alat musik Surya Jaya Sport di Tanjung Redeb, Berau.">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --sjs-bg: #05070c; --sjs-card: #0b0e14; --sjs-gold: #facc15; }
    body { background: var(--sjs-bg); color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .sjs-card { background: var(--sjs-card); border: 1.5px solid rgba(250, 204, 21, 0.35); border-radius: 1.25rem; }
    .sjs-btn-gold { background: linear-gradient(135deg, #facc15, #eab308); color: #05070c; font-weight: 800; }
    .sjs-btn-gold:hover { filter: brightness(1.06); }
    .sjs-btn-dark { background: #141821; border: 1px solid rgba(250, 204, 21, 0.28); color: #f8fafc; font-weight: 700; }
    .sjs-btn-dark:hover { border-color: #facc15; color: #facc15; }
    .brand-side-btn {
      width: 100%;
      text-align: left;
      padding: .58rem .8rem;
      border-radius: .85rem;
      background: #10141d;
      border: 1px solid rgba(250, 204, 21, 0.18);
      color: #e4e4e7;
      font-size: .8125rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      cursor: pointer;
      transition: all .14s ease;
    }
    .brand-side-btn:hover { border-color: #facc15; color: #ffffff; background: #161b26; }
    .brand-side-btn.is-active {
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #05070c;
      border-color: #fef08a;
      font-weight: 900;
    }
    .brand-side-btn.is-active .brand-count-pill {
      background: #05070c;
      color: #facc15;
    }
    .brand-count-pill {
      font-size: .6875rem;
      font-weight: 800;
      padding: .1rem .48rem;
      border-radius: 9999px;
      background: rgba(250, 204, 21, 0.14);
      color: #fde047;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    @media (max-width: 1023px) {
      #brandVerticalList {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: .45rem;
        padding-bottom: .35rem;
      }
      .brand-side-btn {
        width: auto;
        flex-shrink: 0;
        white-space: nowrap;
        padding: .48rem .75rem;
      }
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-30 bg-[#05070c]/95 backdrop-blur border-b-2 border-amber-400 px-4 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <img src="sjs-mark.png" alt="Logo Surya Jaya Sport" class="w-10 h-10 rounded-xl object-contain bg-white p-1 border border-amber-400" onerror="this.style.display='none'">
        <div>
          <h1 class="text-lg sm:text-xl font-black tracking-tight text-white uppercase">Surya Jaya Sport</h1>
          <p class="text-[11px] text-amber-300/90">Sport for a Better Life · Jl. Ahmad Yani 37, Berau</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" id="btnOpenUserCart" class="px-3.5 py-2 rounded-xl sjs-btn-gold text-xs cursor-pointer inline-flex items-center gap-1.5">
          <i class="fa-solid fa-basket-shopping" aria-hidden="true"></i>
          <span>Keranjang (<span id="userCartBadge">0</span>)</span>
        </button>
        <a href="https://wa.me/6282320033333" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs inline-flex items-center gap-1.5">
          <i class="fa-brands fa-whatsapp text-sm" aria-hidden="true"></i>
          <span>Chat WA</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-1">
    <div class="grid grid-cols-1 lg:grid-cols-[240px_minmax(0,1fr)] gap-5 items-start">
      <!-- SIDEBAR VERTIKAL DAFTAR MEREK / BRAND (TANPA LOGO) -->
      <aside class="sjs-card p-3.5 lg:sticky lg:top-20 space-y-2.5" aria-label="Pilih Merek Produk">
        <div class="flex items-center justify-between gap-2 pb-1.5 border-b border-zinc-800">
          <h2 class="text-xs font-black uppercase tracking-wider text-amber-300">Pilih Merek / Brand</h2>
          <button type="button" id="btnResetBrandSide" class="hidden text-[11px] font-bold text-amber-300 hover:underline cursor-pointer">Reset</button>
        </div>
        <div id="brandVerticalList" class="space-y-1.5 max-h-[72vh] overflow-y-auto pr-0.5"></div>
      </aside>

      <!-- KONTEN UTAMA KATALOG -->
      <section class="space-y-5 min-w-0">
        <!-- BANNER KHUSUS SAAT BRAND DIPILIH -->
        <div id="brandSpecialBanner" hidden class="sjs-card p-4 flex flex-wrap items-center justify-between gap-3 border-amber-400">
          <div>
            <span class="px-2.5 py-0.5 rounded-full sjs-btn-gold text-[10px] uppercase">Merek Terpilih</span>
            <h2 id="brandSpecialTitle" class="text-xl sm:text-2xl font-black text-white mt-1"></h2>
            <p id="brandSpecialCount" class="text-xs text-zinc-300"></p>
          </div>
          <button type="button" id="btnShowAllProducts" class="px-3.5 py-2 rounded-xl sjs-btn-dark text-xs text-amber-300 cursor-pointer">
            ← Semua Merek
          </button>
        </div>

        <!-- BAR PENCARIAN & FILTER -->
        <div class="sjs-card p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="relative flex-1 min-w-[210px]">
              <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 text-sm" aria-hidden="true"></i>
              <input type="search" id="userCatalogSearch" placeholder="Cari Yonex, AVO, Finotti, senar, raket, futsal..." class="w-full rounded-xl bg-[#121620] border border-amber-400/40 pl-10 pr-3.5 py-2.5 text-sm text-white">
            </div>
            <label class="inline-flex items-center gap-2 text-xs font-bold text-zinc-300 cursor-pointer select-none">
              <input type="checkbox" id="chkHideOutOfStock" checked class="h-4 w-4 accent-amber-400">
              <span>Sembunyikan stok habis (0)</span>
            </label>
            <span id="catalogResultLabel" class="text-xs font-extrabold text-amber-300 tabular-nums">Memuat...</span>
          </div>
        </div>

        <!-- GRID KATALOG PRODUK -->
        <div id="userCatalogGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      </section>
    </div>
  </main>

  <!-- DIALOG KERANJANG WHATSAPP -->
  <dialog id="userCartDialog" class="m-auto w-11/12 max-w-lg rounded-2xl bg-[#0b0e14] text-white border border-amber-400/50 p-5 shadow-2xl">
    <div class="flex items-center justify-between border-b border-zinc-800 pb-3 mb-3">
      <h3 class="text-base font-black text-amber-300">Keranjang Belanja</h3>
      <button type="button" id="btnCloseUserCart" class="px-3 py-1 rounded-lg sjs-btn-dark text-xs cursor-pointer">Tutup</button>
    </div>
    <div id="userCartList" class="space-y-2.5 max-h-72 overflow-y-auto text-xs"></div>
    <div class="mt-4 pt-3 border-t border-zinc-800 flex flex-wrap items-center justify-between gap-3">
      <strong id="userCartTotal" class="text-sm font-black text-amber-300">Total: Rp 0</strong>
      <a id="btnSendCartWa" href="#" target="_blank" rel="noopener noreferrer" class="hidden px-4 py-2 rounded-xl sjs-btn-gold text-xs inline-flex items-center gap-1.5">
        <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>Kirim ke WhatsApp
      </a>
    </div>
  </dialog>

  <footer class="border-t border-amber-400/25 bg-[#05070c] py-5 px-4 text-center text-xs text-zinc-400 space-y-1.5 mt-8">
    <p>&copy; 2026 <strong class="text-white">Surya Jaya Sport</strong> · Jl. Ahmad Yani 37, Tanjung Redeb, Berau</p>
    <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-1">
      <a href="kebijakan-privasi.html" class="text-xs font-bold text-amber-300/80 hover:text-amber-300 underline">Kebijakan Privasi</a>
      <a href="admin.html" class="text-xs font-bold text-zinc-500 hover:text-amber-300 underline">Login Pemilik</a>
    </div>
  </footer>

  <script type="module" src="./catalog.js"></script>
</body>
</html>
