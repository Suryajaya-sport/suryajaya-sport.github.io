<head>

  <meta property="og:title" content="Detail Produk | Surya Jaya Sport Berau">
  <meta property="og:description" content="Cek foto, harga, dan stok produk Surya Jaya Sport Jl. Ahmad Yani 37, Tanjung Redeb, Berau.">
  <meta property="og:image" content="https://suryajaya-sport.github.io/og-surya-jaya-sport.jpg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: radial-gradient(circle at 15% 0%, rgba(219,234,254,.7), transparent 40%), #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .hdr {
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(12px);
      border-bottom: 1.5px solid #dbeafe;
      padding: .75rem 1rem;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .hdr-in {
      max-width: 44rem;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .65rem;
      text-decoration: none;
      color: #0f2557;
    }
    .brand img { width: 42px; height: 42px; border-radius: .8rem; object-fit: cover; border: 1.5px solid rgba(250,204,21,.7); }
    .brand strong { font-family: 'Barlow Condensed', sans-serif; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .01em; display: block; line-height: 1; }
    .brand span { font-size: .72rem; color: #475569; font-weight: 600; }
    .back-link {
      text-decoration: none;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1.5px solid #bfdbfe;
      padding: .48rem .85rem;
      border-radius: .85rem;
      font-size: .8rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .wrap { max-width: 44rem; width: 100%; margin: 1.25rem auto 2.5rem; padding: 0 1rem; flex: 1; }
    .card {
      background: #ffffff;
      border: 2px solid #dbeafe;
      border-radius: 1.6rem;
      overflow: hidden;
      box-shadow: 0 16px 38px -12px rgba(15,37,87,.12);
    }
    .photo-box {
      background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f1f5f9 100%);
      padding: 1rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 260px;
    }
    .photo-box img { max-width: 100%; max-height: 360px; object-fit: contain; border-radius: 1rem; }
    .body { padding: 1.35rem; display: flex; flex-direction: column; gap: .75rem; }
    .meta { font-family: ui-monospace, monospace; font-size: .78rem; font-weight: 700; color: #1d4ed8; background: #eff6ff; width: fit-content; padding: .2rem .6rem; border-radius: .5rem; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 800; line-height: 1.25; color: #0f172a; }
    .desc { margin: 0; font-size: .92rem; color: #475569; line-height: 1.55; }
    .senar-note { margin: 0; padding: .55rem .8rem; border-radius: .85rem; background: #eff6ff; border: 1.5px solid #bfdbfe; color: #1e3a8a; font-size: .82rem; font-weight: 700; }
    .price-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding-top: .8rem; border-top: 1px solid #f1f5f9; flex-wrap: wrap; }
    .price { margin: 0; background: #fef9c3; color: #0f2557; border: 1.5px solid #fde047; padding: .35rem .85rem; border-radius: .9rem; font-size: 1.45rem; font-weight: 900; }
    .stock { padding: .35rem .85rem; border-radius: 9999px; font-size: .85rem; font-weight: 800; background: #ecfdf5; color: #047857; }
    .stock.out { background: #fff1f2; color: #be123c; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; padding-top: .5rem; }
    @media (max-width: 520px) { .actions { grid-template-columns: 1fr; } }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      min-height: 48px; padding: .7rem 1.1rem; border-radius: 1rem;
      font-size: .92rem; font-weight: 800; text-decoration: none; cursor: pointer;
    }
    .btn-wa { background: linear-gradient(135deg,#16a34a,#15803d); color: #fff; border-bottom: 4px solid #166534; }
    .btn-cat { background: linear-gradient(135deg,#1d4ed8,#2563eb); color: #fff; border-bottom: 4px solid #1e3a8a; }
    .info-foot { font-size: .78rem; color: #64748b; text-align: center; padding: 1.25rem 1rem; }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZS9T9ZJXBK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZS9T9ZJXBK');
  </script>
</head>
<body>
  <header class="hdr">
    <div class="hdr-in">
      <a href="/" class="brand">
        <img src="/sjs-mark-192.png" alt="Logo Surya Jaya Sport" width="42" height="42">
        <div>
          <strong>Surya Jaya Sport</strong>
          <span>Jl. Ahmad Yani 37, Tanjung Redeb, Berau</span>
        </div>
      </a>
      <a href="/" class="back-link">Semua Katalog</a>
    </div>
  </header>

  <main class="wrap">
    <div id="productBox" class="card">
      <div class="body" style="text-align:center; padding: 2.5rem 1.25rem;">
        <p style="margin:0; font-weight:700; color:#475569;">Memuat detail produk…</p>
      </div>
    </div>
  </main>

  <footer class="info-foot">
    Buka setiap hari (Senin–Minggu) 08.00–21.00 WITA · Telp / WhatsApp: <strong>0823-200-33333</strong><br>
    Pengambilan di toko · Bisa pesan / DP via WhatsApp · Tunai, QRIS, Kartu &amp; Transfer
  </footer>

  <script type="module">
    import { catalogImageUrl } from "./katalog.js";
    const EMBEDDED_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBFtI_lwLU7cDcioDE1GpgC0AjKPZ1mHag",
      authDomain: "suryajayasport-3fd5e.firebaseapp.com",
      projectId: "suryajayasport-3fd5e",
      storageBucket: "suryajayasport-3fd5e.firebasestorage.app",
      messagingSenderId: "501860315687",
      appId: "1:501860315687:web:3692f12c2b59a1e16d9402"
    };
    const CATALOG_WA = "https://wa.me/6282320033333";
    const SENAR_NOTE = "Harga tercantum sudah termasuk jasa pasang senar.";

    const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    const rp = n => "Rp " + Math.round(Number(n) || 0).toLocaleString("id-ID");

    const MUSIC_RE = /\b(gitar|guitar|ukulele|bass|capo|plektrum|musik|akustik|acoustic|klasik|classic|elektrik|electric|biola|violin|drum|stik\s*drum|cajon|jimbe|harmonika|tama|sonor|zildjian|yamaha\s*f|pyramid|d'?addario|orphee|ernie\s*ball|elixir|fender|nilon|nylon|kawat)\b/i;
    const BALL_ITEM_RE = /\b(futsal|bola|sepak|basket|voli|volley|football|soccer|molten|spalding|mikasa|nassau)\b/i;
    const BADMINTON_STRING_MODEL_RE = /\b(bg\s*\d{1,2}m?(?!\d)|nbg\s*\d{2,3}(?!\d)|exbolt|nanogy|aerobite|aerosonic|ultimax|tectonic\s*65|vbs\s*\d{2,3}(?!\d)|no\.?\s*[157]\s*boost?)\b/i;
    const BADMINTON_BRAND_RE = /\b(badminton|bulutangkis|raket|shuttlecock|kok|yonex|lining|li-ning|victor|felet|hi-?qua|maxbolt|hundred|kizuna|toalson|apacs|power\s*max|tectonic|flypower|mizuno|astec|hart|ebox|eagle|prochamps|pro\s*ace|ashaway|gosen|rs\b|reinforce|kawasaki|fleet|babolat|bg\s*\d{1,2}m?(?!\d)|nbg\s*\d{2,3}(?!\d)|exbolt|nanogy|aerobite|aerosonic|ultimax|vbs\s*\d{2,3}(?!\d))\b/i;
    const NOT_STRING_ITEM_RE = /\b(raket|racket|sepatu|baju|jersey|celana|tas|grip|kok|shuttlecock|kaos|net|piala|taping|bola|basket|futsal|voli|volley|sepak|molten|spalding|mikasa|catur|chess|pingpong|tenis|senapan|peluru|mimis|sepatu\s*roda|skate|deker|sarung\s*tangan|pompa|matras|dumbbell|barbel|skipping)\b/i;

    function isSenarBadminton(item) {
      const name = String(item?.name || "").trim();
      const txt = [item?.name, item?.category, item?.description].filter(Boolean).join(" ");
      if (MUSIC_RE.test(txt)) return false;
      if (BALL_ITEM_RE.test(txt)) return false;
      if (/\bsenar\s+(raket|badminton|bulutangkis)\b/i.test(name)) return true;
      if (NOT_STRING_ITEM_RE.test(name)) return false;
      const hasSenarWord = /\bsenar\b/i.test(name);
      const isModelOnly = BADMINTON_STRING_MODEL_RE.test(name);
      if (isModelOnly) return true;
      if (hasSenarWord) {
        return BADMINTON_BRAND_RE.test(txt) || /^senar\b/i.test(name);
      }
      return false;
    }

    function matchesCatalogCategory(item, category) {
      if (category === "all") return true;
      const name = String(item?.name || "");
      const isPingpong = /\b(pingpong|tenis\s*meja)\b/i.test(name);
      const ball = !MUSIC_RE.test(name) && BALL_ITEM_RE.test(name);
      const badminton = !isPingpong && !ball && !MUSIC_RE.test(name) && (isSenarBadminton(item) || /\b(badminton|bulutangkis|raket|shuttlecock|kok|yonex|lining|li-ning|victor|felet|hi-?qua|maxbolt|hundred|kizuna|toalson|apacs|power\s*max|tectonic|flypower|mizuno|astec|hart|ebox|prochamps|ashaway|gosen|bg\s*\d{1,2}m?(?!\d)|nbg\s*\d{2,3}(?!\d)|exbolt|nanogy)\b/i.test(name));
      const music = MUSIC_RE.test(name) || (!badminton && !ball && /\bsenar\b/i.test(name));
      const chess = /\b(catur|chess)\b/i.test(name);
      if (category === "music") return music;
      if (category === "badminton") return badminton;
      if (category === "ball") return ball;
      if (category === "chess") return chess;
      if (category === "sport") return !music && !badminton && !ball && !chess;
      return false;
    }

    const box = document.getElementById("productBox");
    const productId = new URLSearchParams(location.search).get("id")?.trim();

    function renderNotFound(msg) {
      box.innerHTML = `<div class="body" style="text-align:center; padding:2.25rem 1.25rem;">
        <h1 style="font-size:1.3rem;">Produk tidak ditemukan</h1>
        <p class="desc">${esc(msg || "Produk mungkin sudah diarsipkan atau kode QR tidak sesuai.")}</p>
        <div class="actions" style="grid-template-columns:1fr; max-width:20rem; margin:.5rem auto 0;">
          <a href="/" class="btn btn-cat">Lihat Semua Katalog</a>
          <a href="${CATALOG_WA}" target="_blank" rel="noopener noreferrer" class="btn btn-wa">Tanya via WhatsApp (0823-200-33333)</a>
        </div>
      </div>`;
    }

    async function fetchProductItem(id) {
      const decodeV = v => !v || typeof v !== "object" ? "" : "stringValue" in v ? v.stringValue : "integerValue" in v ? Number(v.integerValue) : "doubleValue" in v ? Number(v.doubleValue) : "booleanValue" in v ? Boolean(v.booleanValue) : "";
      try {
        const res = await fetch(`https://firestore.googleapis.com/v1/projects/${EMBEDDED_FIREBASE_CONFIG.projectId}/databases/(default)/documents/publicCatalog/${encodeURIComponent(id)}?key=${encodeURIComponent(EMBEDDED_FIREBASE_CONFIG.apiKey)}`, { mode: "cors", cache: "no-store" });
        if (res.status === 404) return null;
        if (!res.ok) throw new Error("HTTP " + res.status);
        const docJson = await res.json();
        const item = { id };
        for (const [k, v] of Object.entries(docJson.fields || {})) item[k] = decodeV(v);
        return item;
      } catch {
        const [appM, fsM] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
        ]);
        const app = appM.getApps().length ? appM.getApps()[0] : appM.initializeApp(EMBEDDED_FIREBASE_CONFIG);
        const db = fsM.getFirestore(app);
        const snap = await fsM.getDoc(fsM.doc(db, "publicCatalog", id));
        return snap.exists() ? { ...snap.data(), id: snap.id } : null;
      }
    }
    (async () => {
    if (!productId) {
      renderNotFound("Silakan buka katalog utama untuk melihat semua barang kami.");
    } else {
      try {
        const item = await fetchProductItem(productId);
        if (!item) {
          renderNotFound();
        } else {
          const imgUrl = catalogImageUrl(item);
          const stockNum = Number(item.stock || 0);
          const out = stockNum <= 0;
          const meta = [item.code, item.size, item.color].filter(Boolean).join(" · ");
          const seoTitle = `${item.name} | Surya Jaya Sport Berau`;
          const seoDesc = item.description
            ? `${item.description} Harga ${rp(item.price)} di Surya Jaya Sport Jl. Ahmad Yani 37, Tanjung Redeb, Berau.`
            : `${item.name}${meta ? ` (${meta})` : ""} harga ${rp(item.price)} (${out ? "Stok habis" : `Stok tersedia ${stockNum} pcs`}) di Surya Jaya Sport Jl. Ahmad Yani 37, Tanjung Redeb, Berau.`;
          document.title = seoTitle;
          const setMeta = (sel, attr, val) => { const el = document.querySelector(sel); if (el && val) el.setAttribute(attr, val); };
          setMeta('meta[name="description"]', "content", seoDesc);
          setMeta('meta[property="og:title"]', "content", seoTitle);
          setMeta('meta[property="og:description"]', "content", seoDesc);
          if (imgUrl) setMeta('meta[property="og:image"]', "content", imgUrl);
          let ld = document.getElementById("productSchema");
          if (!ld) {
            ld = document.createElement("script");
            ld.id = "productSchema";
            ld.type = "application/ld+json";
            document.head.appendChild(ld);
          }
          ld.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "Product",
            name: item.name,
            sku: item.code || item.id,
            description: seoDesc,
            ...(imgUrl ? { image: imgUrl } : {}),
            offers: {
              "@type": "Offer",
              url: window.location.href,
              priceCurrency: "IDR",
              price: Math.max(0, Number(item.price || 0)),
              availability: out ? "https://schema.org/OutOfStock" : "https://schema.org/InStock",
              seller: {
                "@type": "SportingGoodsStore",
                name: "Surya Jaya Sport",
                telephone: "+62-823-200-33333"
              }
            }
          });
          const showSenar = isSenarBadminton(item);
          const waText = out
            ? `Halo Surya Jaya Sport, apakah stok ${item.name}${item.code ? ` (${item.code})` : ""} akan tersedia lagi?`
            : `Halo Surya Jaya Sport, saya mau tanya/pesan ${item.name}${item.code ? ` (${item.code})` : ""} (${rp(item.price)}).`;

          box.innerHTML = `
            <div class="photo-box">
              ${imgUrl
                ? `<img src="${esc(imgUrl)}" alt="${esc(item.name)} — Surya Jaya Sport Tanjung Redeb Berau">`
                : `<div style="text-align:center; padding:2rem; color:#1e3a8a; font-weight:800;">${esc(item.name)}</div>`}
            </div>
            <div class="body">
              ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}
              <h1>${esc(item.name)}</h1>
              ${item.description ? `<p class="desc">${esc(item.description)}</p>` : ""}
              ${showSenar ? `<p class="senar-note">${SENAR_NOTE}</p>` : ""}
              <div class="price-row">
                <p class="price">${rp(item.price)}</p>
                <span class="stock ${out ? "out" : ""}">${out ? "Stok Habis" : `Tersedia: ${stockNum} pcs`}</span>
              </div>
              <div class="actions">
                <a href="${CATALOG_WA}?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener noreferrer" class="btn btn-wa">Tanya / Pesan WA</a>
                <button type="button" id="btnCopyProductLink" class="btn btn-cat">Salin Link</button>
                <a href="/" class="btn btn-cat">Katalog Lain</a>
              </div>
            </div>`;
          if (typeof window.gtag === "function") {
            window.gtag("event", "view_item", { currency: "IDR", value: Number(item.price || 0), items: [{ item_id: item.code || item.id, item_name: item.name, price: Number(item.price || 0) }] });
          }
          box.querySelector('a[href*="wa.me"]')?.addEventListener("click", () => {
            if (typeof window.gtag === "function") {
              window.gtag("event", "whatsapp_click", { product_name: item.name, click_location: "halaman_produk" });
            }
          });
          const copyBtn = document.getElementById("btnCopyProductLink");
          copyBtn?.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(window.location.href);
            } catch {
              const inp = document.createElement("input");
              inp.value = window.location.href;
              document.body.appendChild(inp);
              inp.select();
              document.execCommand("copy");
              inp.remove();
            }
            copyBtn.textContent = "Link Tersalin!";
            setTimeout(() => { copyBtn.textContent = "Salin Link"; }, 2000);
          });
        }
      } catch (err) {
        renderNotFound("Gagal memuat data produk. Silakan hubungi WhatsApp 0823-200-33333.");
      }
    }
    })();
  </script>
</body>
</html>
